name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore AyInbox.sln
      - run: dotnet build AyInbox.sln -c Release --no-restore
      - run: dotnet test AyInbox.sln -c Release --no-build --verbosity normal
      - run: dotnet run --project examples/VerifyWebhook -c Release --no-build
      - run: dotnet pack src/AyInbox -c Release --no-build -o artifacts
